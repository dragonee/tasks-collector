[project]
name = "tasks-agent"
version = "0.1.0"
description = "Scheduled DSPy + ollama batch agent for tasks-collector"
authors = [{ name = "Michał Moroz", email = "michalmoroz@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "dspy>=2.5",
    "requests>=2.31",
    "pydantic>=2.6",
    "python-dateutil>=2.9",
    "python-slugify>=8.0",
    "croniter>=2.0",
]

[project.scripts]
tasks-agent = "tasks_agent.runner:main"
tasks-agent-review = "tasks_agent.jobs.review:main"

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasks_agent"]
