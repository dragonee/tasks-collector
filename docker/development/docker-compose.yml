# TASKS_PORT_PREFIX runs several stacks side by side (see devenv.py): with
# prefix 4 the stack is the project tasks-4 on ports 4000, 4900, 4901 and
# 4079. Unset, it is the project development on 8000, 9000, 9001 and 7079.
# ${P:-8000}${P:+000} reads: 8000 when P is unset, otherwise P followed by 000.
name: ${TASKS_PORT_PREFIX:+tasks-}${TASKS_PORT_PREFIX:-development}

networks:
    tasks:

services:
    tasks-db:
        image: postgres:14-alpine
        environment:
            POSTGRES_PASSWORD: secret
            POSTGRES_USER: tasks
            POSTGRES_DB: tasks
        volumes:
            - "./db:/var/lib/postgresql/data"
        networks:
            - tasks
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U tasks"]
            interval: 2s
            timeout: 2s
            retries: 10
    tasks-queue:
        image: redis:7-alpine
        networks:
          - tasks
    tasks-minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        ports:
            - "${TASKS_PORT_PREFIX:-9000}${TASKS_PORT_PREFIX:+900}:9000"
            - "${TASKS_PORT_PREFIX:-9001}${TASKS_PORT_PREFIX:+901}:9001"
        volumes:
            - "./minio:/data"
        networks:
            - tasks
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 3s
            timeout: 2s
            retries: 10
    tasks-minio-init:
        image: minio/mc:latest
        depends_on:
            tasks-minio:
                condition: service_healthy
        networks:
            - tasks
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://tasks-minio:9000 minioadmin minioadmin &&
            mc mb -p local/trip-photos &&
            exit 0;"
    tasks-celery:
        image: "python:3.14-alpine"
        volumes:
            - "../..:/app"
        networks:
            - tasks
        depends_on:
            - tasks-queue
            - tasks-minio
        environment:
            AWS_ACCESS_KEY_ID: minioadmin
            AWS_SECRET_ACCESS_KEY: minioadmin
            AWS_S3_BUCKET: trip-photos
            AWS_S3_ENDPOINT_URL: "http://tasks-minio:9000"
            AWS_S3_PUBLIC_ENDPOINT_URL: "http://10.0.2.2:${TASKS_PORT_PREFIX:-9000}${TASKS_PORT_PREFIX:+900}"
            AWS_S3_WEB_ENDPOINT_URL: "http://localhost:${TASKS_PORT_PREFIX:-9000}${TASKS_PORT_PREFIX:+900}"
        command: "/app/docker/development/scripts/run-celery.sh"
        working_dir: /app
    tasks-backend:
        image: "python:3.14-alpine"
        volumes:
            - "../..:/app"
        ports:
            - "${TASKS_PORT_PREFIX:-8000}${TASKS_PORT_PREFIX:+000}:8000"
        networks:
            - tasks
        depends_on:
            tasks-db:
                condition: service_healthy
            tasks-minio:
                condition: service_healthy
        environment:
            AWS_ACCESS_KEY_ID: minioadmin
            AWS_SECRET_ACCESS_KEY: minioadmin
            AWS_S3_BUCKET: trip-photos
            AWS_S3_ENDPOINT_URL: "http://tasks-minio:9000"
            AWS_S3_PUBLIC_ENDPOINT_URL: "http://10.0.2.2:${TASKS_PORT_PREFIX:-9000}${TASKS_PORT_PREFIX:+900}"
            AWS_S3_WEB_ENDPOINT_URL: "http://localhost:${TASKS_PORT_PREFIX:-9000}${TASKS_PORT_PREFIX:+900}"
            # Stacks on one host share localhost's cookies whatever the port.
            SESSION_COOKIE_NAME: "sessionid${TASKS_PORT_PREFIX:-}"
        command: "/app/docker/development/scripts/run-development.sh"
        working_dir: /app
    tasks-frontend:
        image: "node:24-alpine"
        volumes:
            - "../..:/app"
        command: "/app/docker/development/scripts/run-frontend.sh"
        working_dir: /app
    mcp-postgres:
        image: bytebase/dbhub:latest
        ports:
            - "${TASKS_PORT_PREFIX:-7079}${TASKS_PORT_PREFIX:+079}:8080"
        networks:
            - tasks
        environment:
            - DBHUB_LOG_LEVEL=info
        command:
            - --transport
            - http
            - --port
            - "8080"
            - --readonly
            - --dsn
            - "postgres://tasks:secret@tasks-db:5432/tasks"
        depends_on:
            tasks-db:
                condition: service_healthy
