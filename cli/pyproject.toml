[project]
name = "tasks-collector-tools"
version = "2.0.0"
description = "CLI support for the Tasks Collector application"
readme = "README.md"
authors = [
    { name = "Michał Moroz", email = "michal@makimo.pl" }
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.14"
dependencies = [
    "colored",
    "more-itertools",
    "pydantic",
    "python-dateutil",
    "python-slugify",
    "requests",
]

[project.scripts]
tc = "tasks_collector_tools.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
