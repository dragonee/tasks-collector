{% extends "tree/settings/base.html" %}

{% block settings %}
<form method="post" class="settings-card">
    {% csrf_token %}
    {% include "tree/settings/_field.html" with field=form.map_provider help="The map service a location opens in, such as where a trip's photo or note was taken." %}
    <div class="settings-actions">
        <button type="submit" class="submit">Save</button>
    </div>
</form>
{% endblock %}
