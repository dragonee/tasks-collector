name: Deploy to production

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docker/development/**'
      - '**.md'
      - 'android/**'
      - 'cli/**'
      - 'agent/**'
      - 'tasks/apps/tree/tests/**'
      - 'tasks/settings/local.py'
      - 'requirements/local.txt'
      - 'requirements/test.txt'

# One deploy at a time. The deploy job SSHes in, runs migrations, then stops
# the containers and starts replacements - so two overlapping runs race on the
# same containers and can leave the older image serving.
#
# cancel-in-progress stays false because a deploy must never be interrupted
# partway: cancelling between `docker stop` and `docker run` takes the site
# down. Superseding a run that is still queued is harmless by contrast - the
# newer image already contains the older commit, and `migrate` applies every
# pending migration - so nothing is lost when GitHub drops it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate version info
        id: version
        run: |
          echo "revision=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "Generated version: $(git describe --tags --always)"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the full commit SHA, which the deploy job pulls. A short SHA
      # would drift: metadata-action always cuts 7 characters, while git's
      # --short grows once the repository gets large enough.
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/production/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REVISION=${{ steps.version.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e

            IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"
            ENV_FILE="${{ secrets.DEPLOY_PATH }}/.env"
            LOG_OPTS="--log-opt max-size=10m --log-opt max-file=5"

            # The workflow token only lives as long as this job, so log out
            # again instead of leaving a dead credential on the server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"
            docker logout ghcr.io

            echo "Running migrations..."
            docker run --rm --network host --env-file "$ENV_FILE" "$IMAGE" \
              python manage.dist.py migrate --noinput

            echo "Stopping old containers..."
            # Give the worker time to finish in-flight thumbnail tasks
            docker stop -t 60 tasks-celery 2>/dev/null || true
            docker rm tasks-celery 2>/dev/null || true
            docker stop tasks-app 2>/dev/null || true
            docker rm tasks-app 2>/dev/null || true

            echo "Starting new containers..."
            docker run -d \
              --name tasks-app \
              --restart unless-stopped \
              --network host \
              --env-file "$ENV_FILE" \
              $LOG_OPTS \
              "$IMAGE"

            # The image's healthcheck probes gunicorn, which the worker doesn't run
            docker run -d \
              --name tasks-celery \
              --restart unless-stopped \
              --network host \
              --env-file "$ENV_FILE" \
              --no-healthcheck \
              $LOG_OPTS \
              "$IMAGE" celery -A tasks worker -l info

            echo "Waiting for tasks-app to be healthy..."
            for i in $(seq 1 60); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' tasks-app)
              if [ "$STATUS" = "healthy" ]; then
                echo "tasks-app is healthy"
                break
              fi
              if [ "$STATUS" = "unhealthy" ] || [ "$i" -eq 60 ]; then
                echo "tasks-app is $STATUS"
                docker logs --tail 50 tasks-app
                exit 1
              fi
              sleep 2
            done

            # Only this repository's images, so other projects on the host keep theirs
            echo "Cleaning up old images..."
            docker image prune -af --filter "until=168h" \
              --filter "label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" || true

            docker ps --filter name=tasks-
