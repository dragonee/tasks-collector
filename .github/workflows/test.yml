name: Test

on:
  pull_request:
    branches:
      - main
    # Whitelist (paths) rather than blacklist (paths-ignore) so that frontend
    # asset changes under tasks/assets/** never trigger a backend test run.
    paths:
      # Backend Python: apps, settings, templates, fixtures, migrations
      - 'tasks/**'
      # ...but not the frontend asset sources built by the "Build assets" step
      - '!tasks/assets/**'
      # Python dependencies and project config
      - 'requirements/**'
      - 'manage.py'
      - 'manage.dist.py'
      - 'pytest.ini'
      - 'pyproject.toml'
      # Frontend build inputs the test job's "Build assets" step depends on
      - 'package.json'
      - 'package-lock.json'
      - 'rsbuild.config.ts'
      # The workflow definition itself
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasks_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/test.txt', 'requirements/base.txt', 'requirements/dist.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install backend packages
        run: pip install -r requirements/test.txt

      - name: Install frontend packages
        run: npm ci

      - name: Build assets for testing
        run: npm run build

      - name: Run Django tests
        env:
          DJANGO_SETTINGS_MODULE: tasks.settings.local
          DB_NAME: tasks_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_TEST_NAME: tasks_test
        run: python manage.py test --noinput
